<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>RAG智库客服</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <strong>RAG智库客服</strong>
          <span id="subTitle">在线 · 可查询知识库与联网信息</span>
        </div>
      </div>
      <div class="top-actions">
        <label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;color:var(--muted);margin-right:10px;">
          <input type="checkbox" id="streamToggle" checked> 流式输出
        </label>
        <label style="font-size:12px;display:flex;align-items:center;gap:4px;user-select:none;color:var(--muted);margin-right:10px;">
          联网：
          <select id="webSearchSel" title="切换联网搜索实现，方便对比两种方案的效果"
                  style="font-size:12px;padding:2px 4px;border-radius:4px;border:1px solid #d0d7de;background:transparent;color:inherit;">
            <option value="mcp">千帆 MCP</option>
            <option value="llm">模型自带</option>
            <option value="off">关闭</option>
          </select>
        </label>
        <span class="pill" id="apiPill">API: 未连接</span>
        <button class="btn" id="btnClear">清空对话</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="dayline">今天</div>
      <div class="msg bot">
        <div class="avatar bot">智能客服</div>
        <div>
          <div class="bubble">你好，我是RAG智库客服。你可以直接提问，我会在“阶段进度”里展示处理过程。</div>
          <div class="meta">提示：可以问“如何使用万用表测量电压？”</div>
        </div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="send">发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
  </div>

 <script type="module" src="chat.js"></script>
</body>
</html>
