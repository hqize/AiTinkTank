# 使用 uv sync 同步
[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.12.0",
    "fastapi>=0.141.1",
    "grandalf>=0.8",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "minio>=7.2.20",
    "numpy>=2.4.6",
    "pymilvus[model]>=3.0.1",
    "pymongo>=4.18.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "transformers>=4.45,<5.0.0",
    "flagembedding>=1.4.2",
    "torch",
    "torchvision",
    "torchaudio",
    "openai-agents>=0.22.2",
    "uvicorn[standard]>=0.53.0",
]

# 根据自己设备选择版本 使用uv pip而不是uv add，因为pytorch不支持uv管理
# uv pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
# 强制从 NVIDIA 源安装
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
